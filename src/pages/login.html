<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Shivam Computer Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Manrope", "Avenir Next", "Segoe UI", sans-serif;
      }
      h1 {
        font-family: "Sora", "Avenir Next", "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body
    data-page="login"
    class="min-h-screen bg-[radial-gradient(circle_at_15%_15%,rgba(94,199,255,0.22),transparent_35%),radial-gradient(circle_at_85%_85%,rgba(122,86,255,0.14),transparent_38%),linear-gradient(165deg,#050812,#0b1120_52%,#111a2a)] text-[#ecf3ff]"
  >
    <main class="mx-auto flex min-h-screen max-w-5xl items-center justify-center px-4 py-10">
      <div class="w-full max-w-md rounded-2xl border border-[#2a3f5d] bg-[linear-gradient(160deg,rgba(17,27,44,0.96),rgba(15,22,37,0.98))] p-8 shadow-[0_20px_50px_rgba(0,0,0,0.45)] backdrop-blur">
        <h1 class="text-2xl font-semibold">Admin login</h1>
        <p class="mt-2 text-sm text-[#a8b6ca]">Use your Shivam Computer credentials to access automation tools.</p>
        <form id="login-form">
          <label class="mt-4 block text-sm text-[#d5deec]">
            Username
            <input class="mt-1 w-full rounded-lg border border-[#2a3f5d] bg-transparent px-3 py-2 text-[#ecf3ff] outline-none placeholder:text-[#a8b6ca] focus:border-[#5ec7ff]" type="text" name="username" required />
          </label>
          <label class="mt-3 block text-sm text-[#d5deec]">
            Password
            <input class="mt-1 w-full rounded-lg border border-[#2a3f5d] bg-transparent px-3 py-2 text-[#ecf3ff] outline-none placeholder:text-[#a8b6ca] focus:border-[#5ec7ff]" type="password" name="password" required />
          </label>
          <button type="submit" class="mt-4 inline-flex rounded-full border border-[#5ec7ff] bg-[#5ec7ff] px-4 py-2 text-sm font-semibold text-[#050812] transition hover:bg-[#81d7ff]">Send credentials</button>
        </form>
        <p id="login-status" class="mt-3 min-h-5 text-sm" role="status"></p>
        <p class="mt-2 text-xs text-[#a8b6ca]">
          We store a temporary session in your browser so you can preview the
          admin dashboard locally.
        </p>
      </div>
    </main>
    <script type="module" src="../app.js"></script>
  </body>
</html>
